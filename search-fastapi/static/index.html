<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Market Idea Expander - WS Client</title>
	<style>
		:root { color-scheme: light dark; }
		body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; }
		.container { max-width: 960px; margin: 0 auto; }
		label { display: block; margin-bottom: .5rem; font-weight: 600; }
		input[type="text"] { width: 100%; padding: .75rem 1rem; border-radius: .5rem; border: 1px solid #888; }
		button { margin-top: 1rem; padding: .75rem 1.25rem; border-radius: .5rem; border: 0; background: #2563eb; color: white; font-weight: 600; cursor: pointer; }
		button:disabled { background: #6b7280; cursor: not-allowed; }
		.output { white-space: pre-wrap; border: 1px solid #888; border-radius: .5rem; padding: 1rem; margin-top: 1.5rem; min-height: 200px; }
	</style>
</head>
<body>
	<div class="container">
		<h1>Market Idea Expander (WebSocket)</h1>
		<p>Enter a topic or type "random ideas". Click Connect to stream the response.</p>
		<label for="topic">Topic</label>
		<input id="topic" type="text" placeholder="e.g. alternative medicine" />
		<div>
			<button id="connect">Connect & Run</button>
			<button id="disconnect" disabled>Disconnect</button>
		</div>
		<div id="status"></div>
		<div class="output" id="output"></div>
	</div>

	<script>
	(function() {
		const status = document.getElementById('status');
		const output = document.getElementById('output');
		const topic = document.getElementById('topic');
		const connectBtn = document.getElementById('connect');
		const disconnectBtn = document.getElementById('disconnect');

		let ws = null;

		function setStatus(text) { status.textContent = text; }
		function append(text) { output.textContent += text; }
		function clear() { output.textContent = ''; }

		function connect() {
			const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
			ws = new WebSocket(url);
			setStatus('Connecting...');
			clear();
			connectBtn.disabled = true;
			disconnectBtn.disabled = false;

			ws.onopen = () => {
				setStatus('Connected. Running...');
				const payload = { topic: topic.value.trim() || 'random ideas' };
				ws.send(JSON.stringify(payload));
			};

			ws.onmessage = (event) => {
				let msg;
				try { msg = JSON.parse(event.data); } catch { return; }

				// Expected shape: { message, data, status }
				if (msg.status === 'error') {
					setStatus('Error: ' + (msg.message || 'unknown'));
					return;
				}
				if (msg.message === 'started') {
					setStatus('Started');
					return;
				}
				if (msg.message === 'chunk' && msg.data && typeof msg.data.text === 'string') {
					append(msg.data.text);
					return;
				}
				if (msg.message === 'completed') {
					setStatus('Completed');
					return;
				}
			};

			ws.onclose = () => {
				setStatus('Disconnected');
				connectBtn.disabled = false;
				disconnectBtn.disabled = true;
			};

			ws.onerror = (err) => {
				console.error(err);
				setStatus('Error. See console.');
			};
		}

		connectBtn.addEventListener('click', connect);
		disconnectBtn.addEventListener('click', () => { if (ws) ws.close(); });
	})();
	</script>
</body>
</html>
