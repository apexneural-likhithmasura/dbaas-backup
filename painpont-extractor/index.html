<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Trending Topics - 15 Years Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        select, button {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        select {
            background: white;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            min-width: 120px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2rem;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .stats {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .stats h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .stats p {
            color: #666;
            font-size: 1.1rem;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .topic-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .topic-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .topic-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .rank {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .topic-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            margin-right: 50px;
            line-height: 1.3;
        }

        .topic-growth {
            font-size: 1.8rem;
            font-weight: 700;
            color: #27ae60;
            margin-bottom: 15px;
        }

        .topic-volume {
            background: #f8f9fa;
            color: #495057;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }

        .topic-description {
            color: #666;
            line-height: 1.6;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .topic-url {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s ease;
        }

        .topic-url:hover {
            color: #764ba2;
        }

        .no-data {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .topics-grid {
                grid-template-columns: 1fr;
            }

            .topic-card {
                padding: 20px;
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Top Trending Topics</h1>
            <p>Discover the fastest-growing topics across different time periods</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="timePeriod">Time Period:</label>
                <select id="timePeriod">
                    <option value="2">2 Years (Short-term Trends)</option>
                    <option value="10">10 Years (Medium-term Growth)</option>
                    <option value="15" selected>15 Years (Long-term Evolution)</option>
                </select>
            </div>
            <div class="control-group">
                <button id="loadTopics" onclick="loadTopics()">Load Top Topics</button>
            </div>
            <div class="control-group">
                <button id="refreshBtn" onclick="refreshData()">🔄 Refresh</button>
            </div>
        </div>

        <div id="stats" class="stats" style="display: none;">
            <h3 id="statsTitle"></h3>
            <p id="statsInfo"></p>
        </div>

        <div id="content">
            <div class="loading pulse">
                <h2>🎯 Loading Top 6 Topics for 15 Years...</h2>
                <p>Fetching the latest trending data...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8001';
        
        // Load topics on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadTopics();
        });

        async function loadTopics() {
            const timePeriod = document.getElementById('timePeriod').value;
            const contentDiv = document.getElementById('content');
            const statsDiv = document.getElementById('stats');
            const loadBtn = document.getElementById('loadTopics');
            
            // Show loading state
            loadBtn.disabled = true;
            loadBtn.textContent = 'Loading...';
            
            contentDiv.innerHTML = `
                <div class="loading pulse">
                    <h2>🎯 Loading Top 6 Topics for ${timePeriod} Years...</h2>
                    <p>Fetching the latest trending data...</p>
                </div>
            `;
            
            statsDiv.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/topics/top/${timePeriod}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.top_topics && data.top_topics.length > 0) {
                    displayTopics(data);
                    displayStats(data);
                } else {
                    contentDiv.innerHTML = `
                        <div class="no-data">
                            <h2>📊 No Topics Found</h2>
                            <p>No topics available for ${timePeriod} years period.</p>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('Error loading topics:', error);
                contentDiv.innerHTML = `
                    <div class="error">
                        <h2>❌ Error Loading Topics</h2>
                        <p>Failed to fetch topics: ${error.message}</p>
                        <p>Make sure the API is running at ${API_BASE_URL}</p>
                    </div>
                `;
            } finally {
                loadBtn.disabled = false;
                loadBtn.textContent = 'Load Top Topics';
            }
        }

        function displayTopics(data) {
            const contentDiv = document.getElementById('content');
            
            const topicsHtml = data.top_topics.map((topic, index) => `
                <div class="topic-card">
                    <div class="rank">#${index + 1}</div>
                    <h3 class="topic-title">${escapeHtml(topic.topic)}</h3>
                    <div class="topic-growth">${escapeHtml(topic.growth)}</div>
                    <div class="topic-volume">📊 Volume: ${escapeHtml(topic.volume)}</div>
                    <p class="topic-description">${escapeHtml(topic.description)}</p>
                    ${topic.url ? `<a href="${topic.url}" target="_blank" class="topic-url">🔗 View Topic Details →</a>` : ''}
                </div>
            `).join('');
            
            contentDiv.innerHTML = `
                <div class="topics-grid">
                    ${topicsHtml}
                </div>
            `;
        }

        function displayStats(data) {
            const statsDiv = document.getElementById('stats');
            const statsTitle = document.getElementById('statsTitle');
            const statsInfo = document.getElementById('statsInfo');
            
            statsTitle.textContent = `📈 Top Topics for ${data.time_period}`;
            statsInfo.textContent = `Showing ${data.count} top-performing topics ranked by growth percentage`;
            
            statsDiv.style.display = 'block';
        }

        function refreshData() {
            loadTopics();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Auto-refresh every 5 minutes
        setInterval(refreshData, 300000);
    </script>
</body>
</html>
